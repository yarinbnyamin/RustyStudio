<script type="module">

    title: "Paddles can't move", topic: "let",

    fn: { name: "paddle_speed", params: [], returns: "f32" },
    starter: "fn paddle_speed() -> f32 {\n    // TODO: create a variable `speed`\n    // with `let` and return it.\n    0.0\n}\n",
    check: (m, code) => {
      const v = m.call("paddle_speed");
      if (!/\blet\s+(mut\s+)?speed\b/.test(code)) return "Close! Create the variable with `let speed = ...;` and return `speed`.";
      return v > 0 && v <= 20 ? null : `speed is ${v}; pick something between 1 and 20.`;

    title: "Nobody ever wins", topic: "const",
    bug: "📝 Your ticket: <b>the match never ends</b>.",
    fixedSay: "✅ Matches end at WIN_SCORE now.",

function box(w, h, d, color, x, y, z, parent = scene) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), new THREE.MeshStandardMaterial({ color, roughness: 0.8 }));

}
function label(html, cls, parent, x, y, z) {
  const el = document.createElement("div");
  el.className = cls;
  el.innerHTML = html;
  const o = new CSS2DObject(el);
  o.position.set(x, y, z);
  parent.add(o);

}
function canvasPlane(w, h, px, py, parent, x, y, z) {
  const cv = document.createElement("canvas");
  cv.width = px; cv.height = py;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const mesh = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ map: tex }));
  mesh.position.set(x, y, z);
  parent.add(mesh);
  return { cv, g: cv.getContext("2d"), tex, mesh };
}

// ---------- Room ----------
box(13, 0.2, 11, 0xa47148, 0, -0.1, 0);                 // wooden floor
box(13, 4.2, 0.2, 0xe9dcc4, 0, 2.1, -5.1);              // back wall

win.position.set(4.3, 2.6, -4.99); scene.add(win);

leaf.position.set(6.0, 1.05, -4.4); leaf.castShadow = true; scene.add(leaf);

// ---------- TV with the live Crab Pong ----------
box(3.4, 2.1, 0.15, 0x1f1a17, 0, 2.55, -4.92);
const tv = canvasPlane(3.15, 1.85, 640, 376, scene, 0, 2.55, -4.83);
label("📺 Crab Pong: current build", "tag", scene, 0, 3.75, -4.8);

// ---------- Whiteboard (project board) + shelf (next games) ----------
const board = canvasPlane(2.6, 1.7, 520, 340, scene, -6.35, 2.3, -2);
board.mesh.rotation.y = Math.PI / 2;
box(0.08, 1.85, 2.75, 0xb8b8b8, -6.42, 2.3, -2);
function drawBoard() {

  g.fillStyle = "#fbfbf8"; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = "#1f2937"; g.font = "bold 30px system-ui"; g.fillText("CRAB PONG", 24, 46);
  g.font = "18px system-ui"; g.fillStyle = "#6b7280"; g.fillText("Chapter 1 · Variables", 24, 72);
  DESKS.forEach((d, i) => {
    g.fillStyle = d.fixed ? "#bbf7d0" : "#fde68a"; g.fillRect(24 + i * 162, 96, 150, 120);
    g.fillStyle = "#1f2937"; g.font = "bold 16px system-ui"; g.fillText(d.fixed ? "✅ FIXED" : "🐞 BUG", 34 + i * 162, 122);
    g.font = "15px system-ui"; wrap(g, d.title, 34 + i * 162, 146, 132, 18);
    g.fillStyle = "#6b7280"; g.fillText(`${d.dev} · ${d.topic}`, 34 + i * 162, 204);
  });
  g.fillStyle = "#1f2937"; g.font = "bold 18px system-ui";
  g.fillText(DESKS.every((d) => d.fixed) ? "All bugs fixed → ship it! 🚀" : `${DESKS.filter((d) => !d.fixed).length} bugs left before launch`, 24, 260);
  g.fillStyle = "#6b7280"; g.font = "16px system-ui"; g.fillText("Next projects: Snake 🔒 · Breakout 🔒", 24, 300);
  board.tex.needsUpdate = true;
}
function wrap(g, text, x, y, w, lh) {
  let line = "";
  for (const word of text.split(" ")) {
    if (g.measureText(line + word).width > w) { g.fillText(line, x, y); line = ""; y += lh; }
    line += word + " ";
  }
  g.fillText(line, x, y);
}
// Shelf on the right side with the studio's game boxes: the "next list"
const shelf = new THREE.Group(); shelf.position.set(-3.7, 0, -4.65); scene.add(shelf);
box(2.6, 0.08, 0.6, 0x8a5a36, 0, 1.2, 0, shelf); box(2.6, 0.08, 0.6, 0x8a5a36, 0, 2.0, 0, shelf);
box(0.08, 2.1, 0.6, 0x8a5a36, -1.3, 1.05, 0, shelf); box(0.08, 2.1, 0.6, 0x8a5a36, 1.3, 1.05, 0, shelf);
const GAMES = [
  { name: "Crab Pong", ch: "Ch 1 · Variables", color: 0xf97316, x: -0.75 },
  { name: "Snake", ch: "Ch 2 · Functions", color: 0x6b7280, x: 0, locked: true },
  { name: "Breakout", ch: "Ch 3 · If", color: 0x6b7280, x: 0.75, locked: true },
];
// Each game box has a printed cover: the studio's "next list".
const gameBoxes = GAMES.map((gm) => {
  const b = box(0.5, 0.65, 0.12, gm.color, gm.x, 1.57, 0, shelf);
  const cover = canvasPlane(0.46, 0.6, 140, 182, shelf, gm.x, 1.57, 0.065);
  const { g } = cover;
  g.fillStyle = gm.locked ? "#4b5563" : "#f97316"; g.fillRect(0, 0, 140, 182);
  g.fillStyle = "#fff"; g.textAlign = "center";
  g.font = "44px system-ui"; g.fillText(gm.locked ? "🔒" : "🦀", 70, 70);
  g.font = "bold 20px system-ui"; g.fillText(gm.name, 70, 118);
  g.font = "13px system-ui"; g.fillText(gm.ch, 70, 146);
  cover.tex.needsUpdate = true;
  return b;
});

// ---------- Desks, computers, devs ----------
const clickables = [];
for (const d of DESKS) {
  const grp = new THREE.Group(); grp.position.set(d.x, 0, -1.2); scene.add(grp);
  box(2.1, 0.08, 1.0, 0xc69c6d, 0, 0.78, 0, grp);
  for (const [lx, lz] of [[-0.95, -0.4], [0.95, -0.4], [-0.95, 0.4], [0.95, 0.4]]) box(0.07, 0.78, 0.07, 0x5b3a22, lx, 0.39, lz, grp);
  box(0.08, 0.3, 0.08, 0x222222, 0, 0.97, -0.3, grp);
  const monitor = box(1.16, 0.74, 0.06, 0x1f1a17, 0, 1.47, -0.32, grp);
  d.screen = canvasPlane(1.06, 0.64, 424, 256, grp, 0, 1.47, -0.285);
  box(0.6, 0.03, 0.2, 0x2f2f2f, 0, 0.83, 0.05, grp);           // keyboard
  // chair
  box(0.55, 0.08, 0.55, 0x334155, 0, 0.55, 0.75, grp); box(0.55, 0.6, 0.08, 0x334155, 0, 0.88, 1.02, grp);
  box(0.08, 0.5, 0.08, 0x222222, 0, 0.28, 0.75, grp);

    const hair = new THREE.Mesh(new THREE.SphereGeometry(0.21, 20, 16, 0, Math.PI * 2, 0, Math.PI / 1.8), new THREE.MeshStandardMaterial({ color: d.hair }));
    hair.position.y = 1.46; hair.rotation.x = 0.35; dev.add(hair);

  } else {

clickables.push({ obj: tv.mesh, tv: true });
function drawScreen(d) {
  const { g, cv } = d.screen;
  g.fillStyle = d.fixed ? "#14532d" : "#3a2330"; g.fillRect(0, 0, cv.width, cv.height);
  g.fillStyle = d.fixed ? "#34d399" : "#f87171"; g.fillRect(0, 0, cv.width, 30);

  g.fillStyle = "#e5e7eb"; g.font = "15px ui-monospace, Consolas, monospace";
  d.code.split("\n").slice(0, 10).forEach((l, i) => g.fillText(l, 10, 54 + i * 19));

  d.screen.tex.needsUpdate = true;
}
drawBoard();

// ---------- Crab Pong (drawn into the TV texture) ----------
const W = tv.cv.width, H = tv.cv.height, PH = 64;
const pong = { you: H / 2, ai: H / 2, bx: W / 2, by: H / 2, vx: 4, vy: 2, sYou: 0, sAi: 0, msg: "", msgUntil: 0 };
const keys = new Set();
addEventListener("keydown", (e) => {
  if (e.key === "Escape") goHome();
  if (document.activeElement !== $("edCode")) keys.add(e.key.toLowerCase());
});
addEventListener("keyup", (e) => keys.delete(e.key.toLowerCase()));
const paddleSpeed = () => (live("paddle") ? live("paddle").call("paddle_speed") : 0);
function serve(dir) { Object.assign(pong, { bx: W / 2, by: H / 2, vx: 4 * dir, vy: (Math.random() * 4 - 2) || 1.5 }); }
function goal(who) {
  const k = who === "you" ? "sYou" : "sAi";
  if (live("score")) pong[k] = live("score").call("score_after_goal", pong[k]);
  const target = live("win") ? live("win").call("win_score") : Infinity;
  if (pong[k] >= target) { pong.msg = who === "you" ? "🏆 YOU WIN!" : "🤖 AI WINS"; pong.msgUntil = performance.now() + 2200; pong.sYou = pong.sAi = 0; }
  serve(who === "you" ? -1 : 1);
}
function pongStep() {
  const sp = paddleSpeed();
  if (mode === "tv") {
    if (keys.has("w") || keys.has("arrowup")) pong.you -= sp;
    if (keys.has("s") || keys.has("arrowdown")) pong.you += sp;
  } else {
    pong.you += Math.max(-sp, Math.min(sp, pong.by - pong.you));   // attract mode: your paddle plays itself
  }
  pong.ai += Math.max(-3.2, Math.min(3.2, pong.by - pong.ai));
  pong.you = Math.max(PH / 2, Math.min(H - PH / 2, pong.you));
  pong.ai = Math.max(PH / 2, Math.min(H - PH / 2, pong.ai));
  pong.bx += pong.vx; pong.by += pong.vy;
  if (pong.by < 8 || pong.by > H - 8) pong.vy *= -1;
  if (pong.bx < 34 && pong.bx > 20 && Math.abs(pong.by - pong.you) < PH / 2 + 8) { pong.vx = Math.abs(pong.vx) * 1.04; pong.vy += (pong.by - pong.you) / 12; }
  if (pong.bx > W - 34 && pong.bx < W - 20 && Math.abs(pong.by - pong.ai) < PH / 2 + 8) { pong.vx = -Math.abs(pong.vx) * 1.04; pong.vy += (pong.by - pong.ai) / 12; }
  if (pong.bx < 0) goal("ai");
  if (pong.bx > W) goal("you");
}
function pongDraw() {
  const g = tv.g;
  g.fillStyle = "#0b1621"; g.fillRect(0, 0, W, H);
  g.strokeStyle = "#2d4d69"; g.setLineDash([8, 10]); g.beginPath(); g.moveTo(W / 2, 0); g.lineTo(W / 2, H); g.stroke(); g.setLineDash([]);
  g.fillStyle = "#f59e0b"; g.fillRect(16, pong.you - PH / 2, 12, PH);
  g.fillStyle = "#7fb3d5"; g.fillRect(W - 28, pong.ai - PH / 2, 12, PH);
  g.font = "28px system-ui"; g.textAlign = "center"; g.fillText("🦀", pong.bx, pong.by + 10);
  g.fillStyle = "#e8eef3"; g.font = "bold 34px system-ui"; g.fillText(pong.sYou, W / 2 - 50, 46); g.fillText(pong.sAi, W / 2 + 50, 46);
  // Show the cause, not just the symptom.
  g.font = "15px ui-monospace, Consolas, monospace"; g.textAlign = "left";
  const sp = paddleSpeed();
  g.fillStyle = sp ? "#86efac" : "#fca5a5"; g.fillText(`speed = ${sp.toFixed(1)}`, 36, Math.min(H - 10, pong.you + PH / 2 + 18));
  if (!live("score")) { g.fillStyle = "#fca5a5"; g.fillText("score += 1  ✖ (not mut)", W / 2 - 100, 72); }
  if (!live("win")) { g.fillStyle = "#fca5a5"; g.fillText("WIN_SCORE = ?  (no winner)", W / 2 - 104, H - 12); }
  if (performance.now() < pong.msgUntil) {
    g.fillStyle = "rgba(245,158,11,.95)"; g.fillRect(W / 2 - 150, H / 2 - 30, 300, 56);
    g.fillStyle = "#2a2118"; g.font = "bold 26px system-ui"; g.textAlign = "center"; g.fillText(pong.msg, W / 2, H / 2 + 8);
  }
  g.textAlign = "left";
  tv.tex.needsUpdate = true;
}

// ---------- Camera moves & modes ----------
let mode = "home", focusDesk = null, tween = null;
function flyTo(pos, target, done) {
  tween = { p0: camera.position.clone(), t0: controls.target.clone(), p1: pos, t1: target, t: 0, done };
  controls.enabled = false;
}
function fitDistance(w, h, fill = 0.82) {
  const vh = 2 * Math.tan(THREE.MathUtils.degToRad(camera.fov / 2));
  return Math.max(h / fill / vh, w / fill / (vh * camera.aspect));
}
function centerOf(mesh) { return mesh.getWorldPosition(new THREE.Vector3()); }
function openDesk(d) {
  mode = "desk"; focusDesk = d;
  const c = centerOf(d.screen.mesh);
  flyTo(c.clone().add(new THREE.Vector3(0, 0, fitDistance(1.06, 0.64))), c, () => {
    $("edTitle").textContent = `${d.dev === "You" ? "you" : d.dev.toLowerCase()}@crab-pong: ~/src/${d.fn.name}.rs`;
    $("edTopic").textContent = `topic: ${d.topic}`;
    $("edTask").textContent = d.task;
    $("edCode").value = d.code;
    $("edConsole").textContent = ""; $("edConsole").className = ""; $("edStatus").textContent = "";
    $("editor").style.display = "flex";
    $("edCode").focus();
  });
  showChrome();
}
function openTv() {
  mode = "tv";
  const c = centerOf(tv.mesh);
  flyTo(c.clone().add(new THREE.Vector3(0, 0, fitDistance(3.15, 1.85, 0.9))), c);
  showChrome();
}
function goHome() {
  if (mode === "home") return;
  if (focusDesk) { focusDesk.code = $("edCode").value; drawScreen(focusDesk); }
  $("editor").style.display = "none";
  mode = "home"; focusDesk = null;
  flyTo(HOME.pos.clone(), HOME.target.clone(), () => (controls.enabled = true));
  showChrome();
}
function showChrome() {
  $("back").style.display = mode === "home" ? "none" : "block";
  $("hud").style.display = mode === "home" ? "block" : "none";
  $("labels").style.display = mode === "home" ? "block" : "none";
  $("ship").style.display = mode === "home" && DESKS.every((d) => d.fixed) && !shipped ? "block" : "none";
}
$("back").onclick = goHome;
// Lay the editor exactly over the monitor screen's projected rectangle.
function placeEditor() {
  if (mode !== "desk" || !focusDesk) return;
  const m = focusDesk.screen.mesh, r = renderer.domElement.getBoundingClientRect();
  const pts = [[-0.53, 0.32], [0.53, 0.32], [-0.53, -0.32], [0.53, -0.32]].map(([x, y]) => m.localToWorld(new THREE.Vector3(x, y, 0)).project(camera));
  const xs = pts.map((p) => (p.x + 1) / 2 * r.width), ys = pts.map((p) => (1 - p.y) / 2 * r.height);
  Object.assign($("editor").style, { left: `${Math.min(...xs)}px`, top: `${Math.min(...ys)}px`, width: `${Math.max(...xs) - Math.min(...xs)}px`, height: `${Math.max(...ys) - Math.min(...ys)}px` });
}

// ---------- Picking ----------
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null, hovered = null;
function pick(e) {
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  const hit = ray.intersectObjects(clickables.map((c) => c.obj), false)[0];
  return hit && clickables.find((c) => c.obj === hit.object);
}
renderer.domElement.addEventListener("pointerdown", (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointermove", (e) => {
  if (mode !== "home") return;
  const c = pick(e);
  hovered = c ? (c.tv ? tv.mesh : c.desk.screen.mesh) : null;
  renderer.domElement.style.cursor = c ? "pointer" : "grab";
});
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5 || mode !== "home") return;
  const c = pick(e);
  if (c?.tv) openTv(); else if (c) openDesk(c.desk);
});

// ---------- Compile ----------
$("edCode").addEventListener("keydown", (e) => {
  if (e.key === "Tab") { e.preventDefault(); const t = e.target, s = t.selectionStart; t.setRangeText("    ", s, t.selectionEnd, "end"); }
  if (e.key === "Enter" && (e.ctrlKey || e.metaKey)) $("edCompile").click();
});
$("edCompile").onclick = async () => {
  const d = focusDesk; if (!d) return;
  d.code = $("edCode").value;
  $("edCompile").disabled = true;
  $("edStatus").textContent = "Compiling on the real Rust compiler…";
  const t0 = performance.now();
  const res = await compileRust(d.code, [d.fn]);
  $("edCompile").disabled = false;
  $("edStatus").textContent = `${((performance.now() - t0) / 1000).toFixed(1)} s`;
  const out = $("edConsole");
  if (!res.ok) { out.className = ""; out.textContent = res.error; return; }
  d.module = res;
  const problem = d.check(res, d.code);
  const wasFixed = d.fixed;
  d.fixed = !problem;
  out.className = problem ? "" : "ok";
  out.textContent = problem ? `Compiled and running in the build, but: ${problem}` : "✅ Compiled! Your code is now running in Crab Pong. Press Esc to watch it on the TV.";
  drawScreen(d); drawBoard();
  if (d.fixed) {
    d.bubble.className = "bubble fixed";
    d.bubble.innerHTML = `<b>${d.dev}:</b> ${d.fixedSay}`;
    if (!wasFixed) d.cheer = performance.now();
  }
};

// ---------- Ship ----------
let shipped = false;
$("ship").onclick = () => {
  shipped = true; showChrome();
  gameBoxes[0].material.emissive = new THREE.Color(0xf59e0b); gameBoxes[0].material.emissiveIntensity = 0.6;
  DESKS.forEach((d) => (d.cheer = performance.now()));
  const b = $("banner");
  b.innerHTML = "🚀 Crab Pong shipped!<br><small>Next project on the shelf: Snake 🔒 (Chapter 2 · Functions)</small>";
  b.style.display = "block"; setTimeout(() => (b.style.display = "none"), 4500);
};

// ---------- Loop ----------
addEventListener("resize", () => {
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight); labels.setSize(innerWidth, innerHeight);
});
const ease = (t) => (t < 0.5 ? 2 * t * t : 1 - (-2 * t + 2) ** 2 / 2);
// Game logic runs on a fixed 60 Hz clock so a frame-rate dip never becomes slow motion.
const STEP = 1000 / 60;
let prev = performance.now(), acc = 0, fpsFrames = 0, fpsSince = prev;
(function frame(now) {
  const dt = Math.min(250, now - prev); prev = now;
  fpsFrames++;
  if (now - fpsSince >= 1000) { $("perf").textContent = `${fpsFrames} fps · ${gpuName}`; fpsFrames = 0; fpsSince = now; }
  if (tween) {
    tween.t = Math.min(1, tween.t + dt / 800);
    const k = ease(tween.t);
    camera.position.lerpVectors(tween.p0, tween.p1, k);
    controls.target.lerpVectors(tween.t0, tween.t1, k);
    camera.lookAt(controls.target);
    if (tween.t === 1) { const done = tween.done; tween = null; done?.(); }
  } else if (controls.enabled) controls.update();
  for (acc += dt; acc >= STEP; acc -= STEP) pongStep();
  pongDraw();
  for (const d of DESKS) {
    const since = d.cheer ? (now - d.cheer) / 1000 : 9;
    d.devGroup.position.y = since < 1.5 ? Math.abs(Math.sin(since * 9)) * 0.25 : Math.sin(now / 600 + d.x) * 0.01;
  }
  for (const c of [tv.mesh, ...DESKS.map((d) => d.screen.mesh)]) c.material.color.setScalar(c === hovered ? 1.25 : 1);
  placeEditor();
  renderer.render(scene, camera);
  labels.render(scene, camera);
  requestAnimationFrame(frame);
})(0);
</script>
</body>
</html>
